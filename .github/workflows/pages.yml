name: Deploy HYPE RIOT to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Also deploys after the dataset check workflow succeeds on main.
  workflow_run:
    workflows: ["Dataset check"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Rebuild dataset from the corpus (deterministic)
        run: python3 pipeline/run_pipeline.py
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Stage dataset beside the app
        # Vite already copies public/ (incl. data/) into dist; this keeps the
        # copy step explicit and idempotent.
        run: |
          mkdir -p apps/web/dist/data
          cp -r public/data/. apps/web/dist/data/
          test -f apps/web/dist/data/v1/manifest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4

name: Dataset check

# Rebuilds the HYPE RIOT dataset from pipeline/corpus/data/*.txt and fails
# if the committed public/data/v1 is out of date or any validation/safety
# gate fails. It never pushes commits (pushes made with GITHUB_TOKEN would
# not trigger Pages anyway); when it succeeds on main, pages.yml redeploys
# via its workflow_run trigger. To change content, edit the corpus text
# files, run `npm run data` locally and commit the result.
on:
  pull_request:
    paths: ["pipeline/**", "public/data/**"]
  push:
    branches: [main]
    paths: ["pipeline/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild + validate (coverage, combo, safety gates)
        run: python3 pipeline/run_pipeline.py --no-daily
      - name: Committed dataset is up to date
        run: git diff --exit-code -- public/data/v1 packages/riot-engine/src/action-verbs.ts packages/riot-engine/src/action-verbs-lz.ts
      - name: Pipeline tests
        run: python3 -m unittest discover -s pipeline/tests -v
